[package]
name = "hiivelabs_storage_lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hiivelabs_rand_utils_lib = { version = "0.1.0", path = "../hiivelabs_rand_utils_lib" }

rusqlite = { version = "0.32.1", features = ["bundled"] }
log = "0.4.22"
miniz_oxide = "0.8.0"
bitcode = { version = "0.6.3" }
rand = "0.9.0-alpha.2"
uuid = { version = "1.10.0", features = ["v4"] }
hex = "0.4.3"
sha2 = "0.11.0-pre.4"
env_logger = "0.11.5"
